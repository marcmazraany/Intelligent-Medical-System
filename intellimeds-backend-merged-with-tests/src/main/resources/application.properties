server.port=${TEST_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${DB_URL1}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.username=${DB_USER1}
spring.datasource.password=${DB_PASS1}
# Hikari (good defaults for transaction pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000

# JPA + schema mgmt (pick one)
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8100}

# --- JWT ---
app.jwt.issuer=intellimeds
app.jwt.access-ttl-minutes=30
app.jwt.refresh-ttl-days=14
app.jwt.secret=${JWT_SECRET1}
logging.level.org.springframework.core.env=DEBUG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
ai.service.base-url=http://localhost:8002
ai.service.analyze-path=/analyze

scanner.service.barcode-url=http://localhost:8000/barcode-info
scanner.service.ocr-url=http://localhost:8001/ocr-info

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
pharmacy.finder.base-url=${PHARMACY_FINDER_URL:http://localhost:8090}
pharmacy.finder.default-latitude=33.8886
pharmacy.finder.default-longitude=35.4955
