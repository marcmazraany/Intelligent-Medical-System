# ============================================
# PHARMACY NODE 1 (Friend 1 - Port 8081)
# REST API - Just stores inventory IN MEMORY (no database!)
# ============================================
spring.main.sources=com.medmanager.node.PharmacyNodeApplication
spring.application.name=pharmacy-node-beta
server.port=8082

# NO DATABASE NEEDED! Pharmacy nodes store inventory in memory (ConcurrentHashMap)
# This makes it SUPER SIMPLE for your friends - just run the app!
test.simulate.network.delay=true
test.simulate.delay.ms=200

# Disable JPA (we don't need it for pharmacy nodes)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Pharmacy Info (optional - for logging)
pharmacy.name=Pharmacy beta
pharmacy.address=Street 2, Beirut, Lebanon
pharmacy.phone=+961-1-XXXXXX

logging.level.root=INFO
logging.level.com.medmanager=INFO