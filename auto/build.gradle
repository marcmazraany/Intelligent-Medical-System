plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.medmanager'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.postgresql:postgresql'
    implementation 'com.mysql:mysql-connector-j:8.3.0'          // NEW
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'org.apache.commons:commons-csv:1.10.0'       // NEW
    implementation 'com.zaxxer:HikariCP'                         // NEW
    implementation 'com.google.maps:google-maps-services:2.2.0'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.20.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
tasks.named('test') {
    useJUnitPlatform()
}

// Main System JAR
bootJar {
    archiveFileName = 'main-system.jar'
    mainClass = 'com.medmanager.MedicationManagementApplication'
}

// Pharmacy Node JAR
task pharmacyNodeJar(type: org.springframework.boot.gradle.tasks.bundling.BootJar) {
    archiveFileName = 'pharmacy-node.jar'
    mainClass = 'com.medmanager.node.PharmacyNodeApplication'
    targetJavaVersion = JavaVersion.VERSION_17

    // Use the same classpath as bootJar
    with bootJar
}

// Build both JARs
task buildAll {
    dependsOn bootJar, pharmacyNodeJar
}

jar {
    enabled = false
}